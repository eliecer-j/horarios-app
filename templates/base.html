{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Turnos · Gestión semanal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: { extend: { colors: { background: "hsl(var(--background))", foreground: "hsl(var(--foreground))", primary: "hsl(var(--primary))", muted: "hsl(var(--muted))", border: "hsl(var(--border))" } } }
    };
  </script>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <link rel="stylesheet" href="{% static 'schedule/styles.css' %}">
</head>
<body class="bg-background text-foreground antialiased">
  <div class="app-shell">
    <aside class="sidebar">
      <a href="{% url 'home' %}" hx-get="{% url 'home' %}" hx-target="#page-content" hx-push-url="true" class="brand">
        <span class="brand-mark">T</span><span>Turnos</span>
      </a>
      <nav class="nav-list" aria-label="Navegación principal">
        <a data-nav-section="schedule" href="{% url 'home' %}" hx-get="{% url 'home' %}" hx-target="#page-content" hx-push-url="true" class="nav-link {% if '/week/' in current_path or current_path == '/' %}active{% endif %}"><span>▦</span> Turnos</a>
        <a data-nav-section="people" href="{% url 'people' %}" hx-get="{% url 'people' %}" hx-target="#page-content" hx-push-url="true" class="nav-link {% if '/people/' in current_path %}active{% endif %}"><span>♧</span> Personas</a>
        <a data-nav-section="branches" href="{% url 'branches' %}" hx-get="{% url 'branches' %}" hx-target="#page-content" hx-push-url="true" class="nav-link {% if '/branches/' in current_path %}active{% endif %}"><span>⌂</span> Sucursales</a>
        <a data-nav-section="analysis" href="{% url 'analysis' %}" hx-get="{% url 'analysis' %}" hx-target="#page-content" hx-push-url="true" class="nav-link {% if '/analysis/' in current_path %}active{% endif %}"><span>▤</span> Análisis</a>
        <a data-nav-section="novelties" href="{% url 'novelties' %}" hx-get="{% url 'novelties' %}" hx-target="#page-content" hx-push-url="true" class="nav-link {% if '/novedades/' in current_path %}active{% endif %}"><span>✦</span> Novedades</a>
        <a data-nav-section="logs" href="{% url 'logs' %}" hx-get="{% url 'logs' %}" hx-target="#page-content" hx-push-url="true" class="nav-link {% if '/logs/' in current_path %}active{% endif %}"><span>▧</span> Logs</a>
      </nav>
      <div class="sidebar-footer">
        <button type="button" class="nav-link theme-toggle" onclick="document.documentElement.classList.toggle('dark'); localStorage.setItem('turnos-theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light')"><span>◐</span> Cambiar tema</button>
      </div>
    </aside>
    <main class="main-shell{% if '/week/' in current_path or '/novedades/' in current_path %} schedule-main-shell{% endif %}">
      <div id="page-content">
        {% include content_template %}
      </div>
    </main>
  </div>
  <script>
    if (localStorage.getItem("turnos-theme") === "dark") document.documentElement.classList.add("dark");
    function updateActiveNavigation() {
      const path = window.location.pathname;
      const activeSection = path === "/" || path.startsWith("/week/")
        ? "schedule"
        : path.startsWith("/people/")
          ? "people"
          : path.startsWith("/branches/")
            ? "branches"
            : path.startsWith("/analysis/")
              ? "analysis"
              : path.startsWith("/novedades/")
                ? "novelties"
                : path.startsWith("/logs/")
                  ? "logs"
              : null;

      document.querySelectorAll("[data-nav-section]").forEach(function (link) {
        const isActive = link.dataset.navSection === activeSection;
        link.classList.toggle("active", isActive);
        if (isActive) link.setAttribute("aria-current", "page");
        else link.removeAttribute("aria-current");
      });
      document.querySelector(".main-shell").classList.toggle(
        "schedule-main-shell",
        activeSection === "schedule" || activeSection === "novelties"
      );
    }
    let preservedPageScroll = 0;
    let preservedScheduleScrollTop = 0;
    let preservedScheduleScroll = 0;
    document.body.addEventListener("htmx:beforeRequest", function (event) {
      if (event.detail.target && event.detail.target.id === "page-content") {
        preservedPageScroll = window.scrollY;
        const schedule = document.querySelector(".schedule-wrap");
        preservedScheduleScrollTop = schedule?.scrollTop || 0;
        preservedScheduleScroll = schedule?.scrollLeft || 0;
      }
    });
    document.body.addEventListener("htmx:afterSettle", function () {
      updateActiveNavigation();
      updateNoveltyFields();
      updateSplitShiftFields();
      const dialog = document.getElementById("assignment-dialog");
      if (dialog && !dialog.open) dialog.showModal();
      const personForm = document.getElementById("person-form-card");
      if (personForm) {
        personForm.scrollIntoView({block: "start", behavior: "instant"});
      } else {
        window.scrollTo(0, preservedPageScroll);
      }
      const schedule = document.querySelector(".schedule-wrap");
      if (schedule) {
        schedule.scrollTop = preservedScheduleScrollTop;
        schedule.scrollLeft = preservedScheduleScroll;
      }
    });
    document.addEventListener("DOMContentLoaded", function () {
      updateActiveNavigation();
      updateNoveltyFields();
      updateSplitShiftFields();
      const dialog = document.getElementById("assignment-dialog");
      if (dialog && !dialog.open) dialog.showModal();
      const personForm = document.getElementById("person-form-card");
      if (personForm) personForm.scrollIntoView({block: "start", behavior: "instant"});
    });
    function updateNoveltyFields() {
      const kind = document.querySelector("[data-novelty-kind-select]");
      if (!kind) return;
      const isLateArrival = kind.value === "late_arrival";
      const times = Array.from(document.querySelectorAll("[data-novelty-late-field]"));
      const splitShift = times.some(function (time) {
        return time.name === "actual_start_time_2";
      });
      times.forEach(function (time) {
        const group = time.closest("[data-novelty-time-group]");
        if (!group) return;
        group.hidden = !isLateArrival;
        time.required = isLateArrival && !splitShift;
        time.setCustomValidity("");
      });
      kind.classList.toggle("novelty-late-arrival-selected", isLateArrival);
    }
    function validateNoveltyArrivalTimes(form) {
      const kind = form.querySelector("[data-novelty-kind-select]");
      const times = Array.from(form.querySelectorAll("[data-novelty-late-field]"));
      if (!kind || kind.value !== "late_arrival" || times.length < 2) return true;
      const missingBoth = times.every(function (time) {
        return !time.value.trim();
      });
      times.forEach(function (time) {
        time.setCustomValidity(
          missingBoth ? "Indica al menos una de las dos horas reales de llegada." : ""
        );
      });
      if (missingBoth) times[0].reportValidity();
      return !missingBoth;
    }
    function updateSplitShiftFields() {
      const status = document.querySelector("[data-assignment-status-select]");
      if (!status) return;
      document.querySelectorAll("[data-split-shift-field]").forEach(function (group) {
        group.hidden = status.value !== "split_shift";
      });
    }
    document.body.addEventListener("change", function (event) {
      if (event.target.matches("[data-novelty-kind-select]")) updateNoveltyFields();
      if (event.target.matches("[data-assignment-status-select]")) updateSplitShiftFields();
    });
    document.body.addEventListener("input", function (event) {
      if (event.target.matches("[data-novelty-late-field]")) {
        const form = event.target.closest("form");
        if (form) validateNoveltyArrivalTimes(form);
      }
    });
    document.body.addEventListener("submit", function (event) {
      if (
        event.target.matches("form")
        && !validateNoveltyArrivalTimes(event.target)
      ) {
        event.preventDefault();
        event.stopImmediatePropagation();
      }
    }, true);
    window.addEventListener("popstate", updateActiveNavigation);
    document.body.addEventListener("htmx:historyRestore", updateActiveNavigation);
  </script>
</body>
</html>
